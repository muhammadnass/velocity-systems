<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="Velocity Systems">
  <title>Velocity Systems</title>
  <defs>
    <linearGradient id="vGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FB4F0"/>
      <stop offset="0.55" stop-color="#1E7FC4"/>
      <stop offset="1" stop-color="#0B2A47"/>
    </linearGradient>
    <linearGradient id="vLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BC8F7"/>
      <stop offset="1" stop-color="#29A3E0"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g>
    <!-- Light-blue back chevron accent -->
    <path d="M14 26 L50 104 L60 104 L24 26 Z" fill="url(#vLight)"/>
    <path d="M44 26 L54 26 L34 68 Z" fill="url(#vLight)" opacity="0.9"/>

    <!-- Bold main V -->
    <path d="M34 26 L58 26 L74 66 L90 26 L114 26 L78 112 L62 112 Z" fill="url(#vGrad)"/>

    <!-- Central accent bar (controller / stylus motif) -->
    <rect x="70" y="40" width="7" height="52" rx="2" fill="url(#vLight)"/>

    <!-- Circuit nodes + signal line -->
    <line x1="92" y1="30" x2="118" y2="16" stroke="#1E7FC4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="16" r="7" fill="#2FB4F0"/>
    <line x1="100" y1="56" x2="122" y2="56" stroke="#1E7FC4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="56" r="7" fill="#1E7FC4"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="72" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="1.5" fill="#0B2A47">VELOCITY</text>
  <text x="152" y="118" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="40" font-weight="500" letter-spacing="9" fill="#1E7FC4">SYSTEMS</text>
</svg>
